/* ---------- mesin tantangan ---------- */

const G=[['run',0,0,560,40],['pr',0,44,120,166],['ed',124,44,300,166],['dm',428,44,132,166],['lg',0,214,560,86]];

E('mn').innerHTML='<h2>Misi 1: Kenali ruang kerjamu</h2><p>Klik satu bagian di jendela Android Studio, lalu pilih fungsinya.</p><div class="row"><svg viewBox="0 0 560 300" width="600" height="321" role="img" aria-label="Denah jendela Android Studio">'+svg+'</svg><div class="col" style="gap:8px">'+PERM.map(k=>{const d=m.ok.includes(P[k][2]);return '<button data-a="d1" data-v="'+k+'" class="'+(d?'ok':'')+'" '+(d?'disabled':'')+'>'+P[k][1]+'</button>'}).join('')+'</div></div><div id="fb">Pilih dulu salah satu bagian jendela.</div>'}

function od(i){const d=MS[i],m=S.m[i]=S.m[i]||{n:0};
E('mn').innerHTML='<h2>Misi '+(i+1)+': '+d.h+'</h2><p>'+d.p+'</p><div class="row"><div class="col" style="gap:8px">'+d.sh.map(k=>'<button data-a="so" data-v="'+k+'" class="'+(k<m.n?'ok':'')+'" '+(k<m.n?'disabled':'')+'>'+d.st[k]+'</button>').join('')+'</div><div class="card col" style="gap:0">'+d.st.map((s,k)=>'<div class="slot">'+(k+1)+'. '+(k<m.n?s:'…')+'</div>').join('')+'</div></div><div id="fb">'+d.f+'</div>'}

function dg(i){const d=MS[i],m=S.m[i]=S.m[i]||{ok:[],sel:null};
const L=d.sh.map(k=>'<button draggable="true" data-a="c3" data-v="'+k+'" class="'+(m.ok.includes(k)?'ok':(m.sel===k?'pri':''))+'" '+(m.ok.includes(k)?'disabled':'')+'>'+d.it[k]+'</button>').join('');
const T=d.tg.map((s,k)=>{const o=m.ok.includes(k);return '<div data-a="t3" data-v="'+k+'" tabindex="0" role="button" aria-label="'+s+'" style="border:2px dashed '+(o?'#1F7A52':(d.ph?'#5a7a98':'#8fb0cc'))+';border-radius:8px;padding:8px 12px;min-height:58px;cursor:pointer;display:flex;align-items:center">'+(o?(d.ph?d.pv[k]:'<span style="font-size:18px"><b style="color:#F2B84B">'+d.it[k]+'</b> – '+s+'</span>'):'<span style="font-size:18px">'+s+'</span>')+'</div>'}).join('');
E('mn').innerHTML='<h2>Misi '+(i+1)+': '+d.h+'</h2><p>'+d.p+'</p><div class="row"><div class="col" style="max-width:300px;gap:8px">'+L+'</div><div class="card" style="flex:1;'+(d.ph?'background:#fff;color:#12263A;':'')+'display:flex;flex-direction:column;gap:8px;padding:12px 18px">'+T+'</div></div><div id="fb">Pilih satu item dulu.</div>'}

function fl(i){const d=MS[i],m=S.m[i]=S.m[i]||{n:0};
const b=k=>'<span style="display:inline-block;min-width:150px;padding:0 8px;border-radius:6px;text-align:center;line-height:1.5;background:'+(k<m.n?'#1F7A52':(k==m.n?'#F2B84B':'#0b1620'))+';color:'+(k==m.n?'#12263A':'#fff')+';border:1px dashed #8fb0cc">'+(k<m.n?d.an[k]:'____')+'</span>';
const ln=d.ln.replace(/\{(\d)\}/g,(x,k)=>b(+k));
E('mn').innerHTML='<h2>Misi '+(i+1)+': '+d.h+'</h2><p>'+d.p+'</p><div class="card" style="font-family:Consolas,monospace;font-size:19px;line-height:1.8">'+ln+'</div><p style="margin-top:10px;font-size:19px;max-width:1100px">'+d.nt+'</p><div style="display:flex;flex-wrap:wrap;gap:8px">'+d.bk.map(w=>'<button data-a="w4" data-v="'+w+'">'+w+'</button>').join('')+'</div><div id="fb">Pilih kata untuk bagian kosong pertama.</div>'}

function sc(i){const d=MS[i],m=S.m[i]=S.m[i]||{q:0,t:90,w:0,d:0};
if(m.d&&m.q<d.cs.length-1){m.q++;m.d=0;m.w=0}
if(d.tm&&!TI&&!S.done[i])TI=setInterval(()=>{if(m.t>0)m.t--;const x=E('tm');if(x)x.textContent=m.t},1000);
const c=d.cs[m.q];
E('mn').innerHTML='<h2>Misi '+(i+1)+': '+d.h+'</h2><div style="display:flex;justify-content:space-between;font-size:22px;margin-bottom:8px"><span>Kasus '+(m.q+1)+' dari '+d.cs.length+'</span>'+(d.tm?'<span>Sisa waktu bonus: <b id="tm">'+m.t+'</b> detik</span>':'<span></span>')+'</div><div class="card"><p style="margin:0">'+c.q+'</p></div><div class="col" style="margin-top:12px;gap:8px">'+c.o.map((o,k)=>'<button data-a="oc" data-v="'+k+'">'+o+'</button>').join('')+'</div><div id="fb">Pilih tindakan yang paling tepat.</div>'}

function qz(i){const m=S.m[i]=S.m[i]||{q:0,a:0,set:D.map((x,k)=>k).sort(()=>Math.random()-.5).slice(0,5)};
if(m.a&&m.q<4){m.q++;m.a=0}
const c=D[m.set[m.q]];
E('mn').innerHTML='<h2>Demo ke klien</h2><div style="font-size:22px;margin-bottom:8px">Soal '+(m.q+1)+' dari 5</div><div class="card"><p style="margin:0">'+c.q+'</p></div><div class="col" style="margin-top:12px;gap:8px">'+c.o.map((o,k)=>'<button data-a="o6" data-v="'+k+'">'+o+'</button>').join('')+'</div><div id="fb">Pilih jawaban yang paling tepat.</div>'}

/* ---------- aksi ---------- */
const A={
g:v=>{const i=idx(v);if(S.done[i]){S.done[i]=0;S.sc[i]=0;S.lv[i]=3;S.m[i]=null}go(v)},
k1(k){const m=S.m[0];if(m.ok.includes(k))return;m.sel=k;rg(0);fb('Bagian dipilih. Sekarang pilih fungsinya.')},
d1(v){const m=S.m[0];v=+v;if(!m.sel){fb('Klik dulu salah satu bagian jendela.','bad');return}
 if(P[v][2]==m.sel){m.ok.push(m.sel);m.sel=null;S.sc[0]+=100;snd(1);rg(0);hud();
  if(m.ok.length==5){S.done[0]=1;nav();fb('Misi 1 selesai! Kamu sudah mengenal ruang kerjamu. +100','ok')}else fb('Benar! '+P[v][0]+': '+P[v][1]+'. +100','ok')}
 else{lose(0);fb('Belum tepat. Petunjuk: '+P.find(p=>p[2]==m.sel)[3],'bad')}},
so(v){const i=cur(),d=MS[i],m=S.m[i];v=+v;
 if(v==m.n){m.n++;S.sc[i]+=100;snd(1);od(i);hud();
  if(m.n==d.st.length){S.done[i]=1;nav();fb('Misi '+(i+1)+' selesai! '+d.fin+' '+d.ex[v]+' +100','ok')}else fb('Tepat! '+d.ex[v]+' +100','ok')}
 else{lose(i);fb('Belum urutan itu. Tanyakan: apa yang harus siap sebelum langkah ini?','bad')}},
c3(v){const i=cur(),d=MS[i],m=S.m[i];v=+v;if(m.ok.includes(v))return;m.sel=v;dg(i);fb('"'+d.it[v]+'" dipilih. Sekarang pilih tempatnya.')},
t3(v){const i=cur(),d=MS[i],m=S.m[i];v=+v;
 if(m.sel==null){fb('Pilih dulu item yang akan dicocokkan.','bad');return}
 if(m.ok.includes(v))return;
 if(m.sel==v){m.ok.push(v);m.sel=null;S.sc[i]+=100;snd(1);dg(i);hud();
  if(m.ok.length==d.it.length){S.done[i]=1;nav();fb('Misi '+(i+1)+' selesai! '+d.fin+' +100','ok')}else fb('Tepat! Item itu cocok dengan tempatnya. +100','ok')}
 else{lose(i);fb('Belum cocok. Petunjuk: '+d.hn[v],'bad')}},
w4(v){const i=cur(),d=MS[i],m=S.m[i];if(S.done[i])return;
 if(v==d.an[m.n]){m.n++;S.sc[i]+=100;snd(1);fl(i);hud();
  if(m.n==d.an.length){S.done[i]=1;nav();fb('Misi '+(i+1)+' selesai! '+d.fin+' +100','ok')}else fb('Tepat! '+d.ex[m.n-1]+' +100','ok')}
 else{lose(i);fb('Belum tepat. Baca lagi keterangan di bawah kode dan perhatikan ejaan persis.','bad')}},
oc(v){const i=cur(),d=MS[i],m=S.m[i],c=d.cs[m.q],bs=document.querySelectorAll('[data-a=oc]');v=+v;if(S.done[i]||m.d)return;
 if(v==c.a){m.d=1;const pts=m.w?50:100;S.sc[i]+=pts;snd(1);bs.forEach((b,k)=>{b.disabled=true;if(k==v)b.classList.add('ok')});
  if(m.q==d.cs.length-1){let bn=0;if(d.tm){stopT();bn=m.t*2;S.sc[i]+=bn}S.done[i]=1;nav();fb(c.e+' +'+pts+'. Misi '+(i+1)+' selesai!'+(d.tm?' Bonus waktu +'+bn:''),'ok')}
  else{fb(c.e+' +'+pts,'ok');E('mn').insertAdjacentHTML('beforeend','<button class="pri" style="margin-top:10px" data-a="nc">Kasus berikutnya</button>')}
  hud()}
 else{m.w=1;bs[v].disabled=true;bs[v].classList.add('bad');lose(i);fb('Belum tepat. Pikirkan lagi penyebab masalah sebelum bertindak. Coba pilihan lain.','bad')}},
nc(){const i=cur(),m=S.m[i];m.q++;m.w=0;m.d=0;sc(i)},
o6(v){const i=LAST,m=S.m[i],c=D[m.set[m.q]],bs=document.querySelectorAll('[data-a=o6]');v=+v;if(m.a)return;m.a=1;
 bs.forEach((b,k)=>{b.disabled=true;if(k==c.a)b.classList.add('ok');else if(k==v)b.classList.add('bad')});
 if(v==c.a){S.sc[i]+=100;snd(1);fb('Benar! '+c.e+' +100','ok')}else{snd(0);fb('Belum tepat. '+c.e,'bad')}
 hud();
 if(m.q==4){S.done[i]=1;nav();fb(E('fb').textContent+' Demo selesai!',E('fb').className)}
 else E('mn').insertAdjacentHTML('beforeend','<button class="pri" style="margin-top:10px" data-a="n6">Soal berikutnya</button>')},
n6(){const m=S.m[LAST];m.q++;m.a=0;qz(LAST)}
};
